<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOES — Free Open Election Simulator</title>
  <meta name="description"
    content="FOES (Free Open Election Simulator) is an interactive election-night simulator, scenario editor, and Monte Carlo forecast atlas for EU-27, USA 2024, and custom electoral systems." />
  <meta property="og:title" content="FOES - Free Open Election Simulator" />
  <meta property="og:description"
    content="FOES (Free Open Election Simulator) is an interactive election-night simulator, scenario editor, and Monte Carlo forecast atlas for EU-27, USA 2024, and custom electoral systems." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main id="map-stage" aria-label="Interactive Election Atlas">
    <canvas id="map-canvas" aria-label="Interactive Election Map"></canvas>

    <div id="map-tooltip" class="tooltip hidden"></div>

    <!-- Top-left floating frosted command strip -->
    <header class="hud hud-top-left">
      <div class="brand-row">
        <div class="brand">
          <span id="brand-mark" class="brand-mark">FO</span>
          <div>
            <h1 title="Free Open Election Simulator">FOES</h1>
            <div id="scenario-subtitle" class="subtitle">Loading election atlas…</div>
            <select id="scenario-select" class="scenario-select hidden" aria-label="Select election scenario"></select>
            <div id="scenario-note" class="scenario-note hidden"></div>
          </div>
        </div>
        <div class="brand-right">
          <span id="sim-clock" class="sim-clock mono" title="Simulated Election Night Clock">--:--</span>
          <div id="status-badge" class="status-badge status-idle">
            <span class="status-dot"></span>
            <span id="status-text">READY</span>
          </div>
          <button id="btn-theme" class="icon-btn" title="Switch Light / Dark theme" aria-label="Toggle theme">◐</button>
        </div>
      </div>

      <div class="controls-row">
        <div id="mode-switch" class="segmented" role="group" aria-label="Simulation mode">
          <button class="mode-btn active" data-mode="live">Live</button>
          <button class="mode-btn" data-mode="forecast"
            title="Simulate N election nights for win odds and seat percentiles">Forecast</button>
        </div>
        <button id="btn-run" class="btn btn-ink">▶ Start</button>
        <button id="btn-reset" class="btn btn-icon" title="Reset election" aria-label="Reset election"
          disabled>↺</button>
        <div id="forecast-controls" class="forecast-controls hidden">
          <label class="mini-field" title="Polling uncertainty / election-night volatility">
            <span>Swing</span>
            <input id="input-swing" type="range" min="0" max="0.60" step="0.05" value="0.15" />
            <output id="swing-val">0.15</output>
          </label>
          <label class="mini-field" title="Number of correlated Monte Carlo runs">
            <span>Runs</span>
            <select id="forecast-runs" aria-label="Monte Carlo simulation count">
              <option value="100">100</option>
              <option value="200" selected>200</option>
              <option value="500">500</option>
            </select>
          </label>
          <button id="btn-run-forecast" class="btn btn-ink">↻ Re-run</button>
        </div>
        <button id="btn-editor" class="btn btn-accent" title="Open Scenario Editor (E)">✎ Scenario Editor</button>
        <div id="speed-group" class="segmented" role="group" aria-label="Broadcast speed">
          <button class="seg-btn active" data-duration="45000">1×</button>
          <button class="seg-btn" data-duration="22000">2×</button>
          <button class="seg-btn" data-duration="9000">5×</button>
          <button class="seg-btn" data-duration="0">Instant</button>
        </div>

        <label class="mini-field" title="Reproducible random seed">
          <span>Seed</span>
          <input id="input-seed" type="number" value="42" />
          <button id="btn-rand-seed" class="icon-btn" title="Randomize seed">↻</button>
        </label>

        <label class="mini-field" title="Voter choice temperature">
          <span>Temp</span>
          <input id="input-temp" type="range" min="0.25" max="1.50" step="0.05" value="0.45" />
          <output id="temp-val">0.45</output>
        </label>

        <label class="mini-field" title="Override seat allocation rule across all regions">
          <span>System</span>
          <select id="method-select" aria-label="Electoral system override">
            <option value="">Native</option>
            <option value="sainte_lague">Sainte-Laguë</option>
            <option value="dhondt">D'Hondt</option>
            <option value="hare">Hare</option>
            <option value="stv">STV</option>
            <option value="fptp">FPTP</option>
          </select>
        </label>
      </div>

      <div class="nav-row">
        <div class="focus-pills" id="focus-pills">
          <button id="overview-focus-btn" class="focus-btn active" data-focus="eu">Europe</button>
          <select id="country-select" class="country-select hidden" aria-label="Jump to region"></select>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <span id="progress-label" class="mono">0 / 0</span>
        </div>
      </div>
    </header>

    <!-- Right rail: top-right overlay switcher stacked cleanly above slide-in inspector -->
    <div class="right-rail">
      <aside class="hud hud-top-right">
        <div class="overlay-bar" role="group" aria-label="Map overlay">
          <button class="ov-btn active" data-overlay="winner" aria-pressed="true">Winner</button>
          <button id="ov-party-btn" class="ov-btn" data-overlay="party" aria-pressed="false">Group %</button>
          <button class="ov-btn" data-overlay="turnout" aria-pressed="false">Turnout</button>
          <button id="ov-eu-axis" class="ov-btn" data-overlay="eu_axis" aria-pressed="false">Pro-EU</button>
          <button class="ov-btn" data-overlay="econ_axis" aria-pressed="false">Econ</button>
          <button class="ov-btn" data-overlay="mig_axis" aria-pressed="false">Migration</button>
        </div>

        <div id="color-mode-row" class="sub-control-row">
          <span class="sub-label">Colors</span>
          <div class="segmented" role="group" aria-label="Party color mode">
            <button class="cm-btn active" data-colormode="auto"
              title="Groups when zoomed out, regional parties when zoomed in">Auto</button>
            <button class="cm-btn" data-colormode="group">Groups</button>
            <button class="cm-btn" data-colormode="national">National</button>
          </div>
        </div>

        <div id="party-picker-wrap" class="sub-control-row hidden">
          <label id="party-select-label" class="sub-label" for="party-select">Group</label>
          <select id="party-select"></select>
        </div>

        <div id="map-legend" class="legend"></div>
      </aside>

      <aside id="battlegrounds" class="hud battlegrounds hidden" aria-label="Closest races">
        <div class="hud-header">
          <span class="hud-kicker">CLOSEST RACES</span>
          <span id="battlegrounds-sub" class="hud-sub mono"></span>
        </div>
        <div id="battlegrounds-list" class="battlegrounds-list"></div>
      </aside>

      <aside id="inspector" class="hud inspector hidden" aria-label="Selection inspector">
        <div class="inspector-head">
          <div>
            <div id="inspector-kicker" class="hud-kicker">REGION</div>
            <h2 id="inspector-title">—</h2>
          </div>
          <button id="btn-close-inspector" class="icon-btn" title="Close (Esc)" aria-label="Close inspector">✕</button>
        </div>
        <div id="inspector-stats" class="inspector-stats"></div>
        <div id="inspector-actions" class="inspector-actions"></div>
        <div id="inspector-bars" class="inspector-bars"></div>
      </aside>
    </div>

    <!-- Zoom controls -->
    <div class="hud zoom-controls">
      <button id="btn-zoom-in" class="zoom-btn" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="btn-zoom-out" class="zoom-btn" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="btn-zoom-reset" class="zoom-btn" title="Reset overview" aria-label="Reset view">⌖</button>
    </div>

    <!-- Bottom-left collapsible Parliament Hemicycle / Electoral Bar & Coalition Finder HUD -->
    <section id="hemicycle-hud" class="hud hud-bottom-left">
      <div class="hud-header">
        <div>
          <span id="hud-kicker" class="hud-kicker">PARLIAMENT</span>
          <div class="hud-sub"><span id="hemicycle-total" class="mono">0</span> <span id="seat-unit-label">seats</span>
            · majority <span id="hemicycle-maj" class="mono">0</span></div>
        </div>
        <div class="hemi-head-actions">
          <div id="hemi-tabs-wrap" class="segmented" role="group" aria-label="Parliament panel view">
            <button class="htab-btn active" data-htab="seats">Seats</button>
            <button class="htab-btn" data-htab="coalitions">Coalitions</button>
          </div>
          <button id="btn-toggle-hemi" class="icon-btn" title="Collapse/Expand" aria-expanded="true"
            aria-label="Toggle parliament panel">▾</button>
        </div>
      </div>
      <div id="hemicycle-body" class="hemicycle-body">
        <svg id="hemicycle-svg" viewBox="0 0 360 195" aria-label="Seat distribution chart"></svg>
        <div id="forecast-summary" class="forecast-summary hidden"></div>
        <div id="seat-ledger" class="seat-ledger"></div>
        <div id="coalition-list" class="coalition-list hidden"></div>
      </div>
    </section>

    <!-- Bottom-right live county ticker + map attribution -->
    <div class="bottom-right-stack">
      <aside id="ticker" class="hud ticker" aria-live="polite"></aside>
      <div class="meta-pills">
        <a class="version-pill" href="https://github.com/Apollonyon/FOESim" target="_blank" rel="noopener noreferrer"
          title="Source code on GitHub (AGPL-3.0)">GitHub ↗</a>
        <button id="btn-version" type="button" class="version-pill hidden" title="Version &amp; changelog"></button>
      </div>
      <div id="map-attribution" class="attribution"></div>
    </div>

    <div id="editor-modal" class="editor-modal hidden" aria-hidden="true"></div>
    <div id="changelog-modal" class="editor-modal hidden" aria-hidden="true"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>

</html>
